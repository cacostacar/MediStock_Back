# Profile "oracle": persistencia no Oracle + integracao com as procedures/functions PL/SQL
# Criar o schema antes com docs/plsql/medistock_plsql.sql
# Ativar com: SPRING_PROFILES_ACTIVE=oracle
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# O schema e mantido pelo script PL/SQL, o Hibernate nao altera as tabelas
spring.jpa.hibernate.ddl-auto=none
