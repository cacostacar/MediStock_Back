# Perfil "oracle": ativado com SPRING_PROFILES_ACTIVE=oracle (no .env ou no ambiente).
# As configuracoes deste perfil sobrescrevem as de SQLite do arquivo comum.
# O schema e criado pelos scripts de database/oracle; o Hibernate apenas o valida.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:MEDISTOCK}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.dialect.oracle.use_binary_floats=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
